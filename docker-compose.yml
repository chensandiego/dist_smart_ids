version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: smart_ids
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    image: dist_smart_ids_aggregator:latest
    depends_on:
      - postgres
      - rabbitmq
      - elasticsearch
      - kafka
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ELASTICSEARCH_HOST=elasticsearch
      - KAFKA_HOST=kafka

  suricata:
    build:
      context: ./suricata
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./suricata/rules:/etc/suricata/rules
      - suricata_logs:/var/log/suricata

  rule_updater:
    build:
      context: ./rule_updater
      dockerfile: Dockerfile
    volumes:
      - ./suricata/rules:/app/rules

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - aggregator
    environment:
      - AGGREGATOR_BASE_URL=http://aggregator:5000

  image-scan:
    image: aquasec/trivy:latest
    command: image --severity HIGH,CRITICAL dist_smart_ids_aggregator:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  falco:
    image: falcosecurity/falco:latest
    privileged: true
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - ./falco/falco.yaml:/etc/falco/falco.yaml
      - ./falco/rules.d:/etc/falco/rules.d
    command: falco -c /etc/falco/falco.yaml -r /etc/falco/falco_rules.yaml -r /etc/falco/rules.d/custom_rules.yaml

volumes:
  suricata_logs: